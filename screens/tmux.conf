set -g default-terminal "tmux-256color"
set -g escape-time 1000
set -g status 2
set -g status-interval 1
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left "#[fg=#1e1e2e,bg=#cba6f7,bold] #S #[default] "
set -g status-left-length 20
set -g status-right ""
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#cba6f7,bold] #I:#W "
set -g @revamped_screen_keys ""
set -g status-format[1] "#[align=centre]#{?#{@revamped_screen_keys},#[fg=#1e1e2e#,bg=#f9e2af#,bold] #{@revamped_screen_keys} ,}"
set -g default-command "bash --noprofile --rcfile '$SCREENS_REPO/screens/setup.sh'"
bind -n C-] command-prompt -p "" "set -g @revamped_screen_keys '%%'"
set -g display-time 3000
set-environment -g PATH "/Users/Shared/demo/bin:/usr/bin:/bin:/usr/sbin:/sbin"
set-environment -g REVAMPED_TEST_DF /Users/Shared/demo/bin/df
set -g status-right "#{disk_bg_color}#{disk_fg_color}#{disk_icon} #{disk_percentage}#[default] #{disk_used}/#{disk_total} #{disk_free} free"
set -g status-right-length 110
set -g @disk_revamped_interval 1
set -g @disk_revamped_detail_interval 5
set -g @disk_revamped_low_fg_color "#[fg=#a6e3a1]"
set -g @disk_revamped_medium_fg_color "#[fg=#f9e2af]"
set -g @disk_revamped_high_fg_color "#[fg=#f38ba8]"
set -g @disk_revamped_low_bg_color "#[bg=#313244]"
set -g @disk_revamped_medium_bg_color "#[bg=#45475a]"
set -g @disk_revamped_high_bg_color "#[bg=#585b70]"
run-shell /Users/Shared/demo/tmux-disk-revamped/disk-revamped.tmux
